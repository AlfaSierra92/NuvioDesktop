
name: Build and Release macOS DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build macOS ARM64
    runs-on: macos-15
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          architecture: aarch64
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install native dependencies
        run: |
          brew install mpv pkg-config

          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

          pkg-config --modversion mpv
          xcrun --find clang++
          java -version

          test "$(uname -m)" = "arm64"

      - name: Verify build prerequisites
        run: |
          chmod +x gradlew

          test -f composeApp/build.gradle.kts
          test -f composeApp/Configuration/DesktopVersion.properties
          test -f composeApp/src/desktopMain/native/macos/player_bridge.mm

          ./gradlew --version

      - name: Build release DMG
        env:
          NUVIO_MACOS_SIGNING_IDENTITY: ""
          NUVIO_MACOS_NOTARY_APPLE_ID: ""
          NUVIO_MACOS_NOTARY_TEAM_ID: ""
          NUVIO_MACOS_NOTARY_PASSWORD: ""
        run: |
          ./gradlew :composeApp:packageReleaseDmg \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache \
            --no-daemon \
            --stacktrace

      - name: Prepare DMG
        id: package
        run: |
          set -euo pipefail

          DMG_DIR="composeApp/build/compose/binaries/main-release/dmg"

          test -d "$DMG_DIR"

          mapfile -t DMGS < <(
            find "$DMG_DIR" -maxdepth 1 -type f -name "*.dmg" | sort
          )

          if [ "${#DMGS[@]}" -ne 1 ]; then
            echo "Expected exactly one DMG, found ${#DMGS[@]}"
            find composeApp/build/compose -name "*.dmg" || true
            exit 1
          fi

          mkdir -p release

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi

          OUTPUT="release/NuvioDesktop-${VERSION}-macOS-arm64.dmg"

          cp "${DMGS[0]}" "$OUTPUT"

          hdiutil verify "$OUTPUT"
          shasum -a 256 "$OUTPUT" > "$OUTPUT.sha256"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          ls -lh release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NuvioDesktop-macOS-ARM64
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          gh release create "$VERSION" \
            release/* \
            --title "NuvioDesktop $VERSION" \
            --generate-notes \
            --verify-tag

