
name: Build and Release macOS DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS ARM64
    runs-on: macos-15
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          architecture: aarch64
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install native dependencies
        run: |
          set -euo pipefail

          brew install \
            mpv \
            pkg-config \
            cmake \
            openssl@3 \
            llvm@19

          LLVM_HOME="$(brew --prefix llvm@19)"

          echo "LLVM_HOME=$LLVM_HOME" >> "$GITHUB_ENV"

          "$LLVM_HOME/bin/clang++" --version
          cmake --version
          pkg-config --modversion mpv

          test "$(uname -m)" = "arm64"

      - name: Clone NuvioEngine
        run: |
          set -euo pipefail

          ENGINE_SOURCE="$RUNNER_TEMP/nuvio-engine"

          git clone --depth 1 \
            https://github.com/NuvioMedia/nuvio-engine.git \
            "$ENGINE_SOURCE"

          test -f "$ENGINE_SOURCE/CMakeLists.txt"

          echo "ENGINE_SOURCE=$ENGINE_SOURCE" >> "$GITHUB_ENV"

      - name: Build NuvioEngine
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew :composeApp:buildMacosNuvioEngine \
            "-Pnuvio.engine.sourceDir=$ENGINE_SOURCE" \
            "-Pnuvio.macos.llvmHome=$LLVM_HOME" \
            --no-configuration-cache \
            --no-daemon \
            --stacktrace

          test -s \
            composeApp/build/native/macos/libnuvio_engine.dylib

      - name: Build release DMG
        env:
          NUVIO_MACOS_SIGNING_IDENTITY: ""
          NUVIO_MACOS_NOTARY_APPLE_ID: ""
          NUVIO_MACOS_NOTARY_TEAM_ID: ""
          NUVIO_MACOS_NOTARY_PASSWORD: ""
        run: |
          set -euo pipefail

          ./gradlew :composeApp:packageReleaseDmg \
            "-Pnuvio.engine.sourceDir=$ENGINE_SOURCE" \
            "-Pnuvio.macos.llvmHome=$LLVM_HOME" \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache \
            --no-daemon \
            --stacktrace

      - name: Prepare DMG
        run: |
          set -euo pipefail

          DMG=$(find composeApp/build/compose \
            -type f -name "*.dmg" -print -quit)

          if [ -z "$DMG" ]; then
            echo "ERROR: DMG not found"
            exit 1
          fi

          mkdir -p release

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi

          OUTPUT="release/NuvioDesktop-${VERSION}-macOS-arm64.dmg"

          cp "$DMG" "$OUTPUT"

          hdiutil verify "$OUTPUT"

          (
            cd release
            shasum -a 256 "$(basename "$OUTPUT")" \
              > "$(basename "$OUTPUT").sha256"
          )

          ls -lh release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NuvioDesktop-macOS-ARM64
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/* \
            --title "NuvioDesktop $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

