
name: Build macOS DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          architecture: aarch64
          cache: gradle

      - name: Install dependencies
        run: |
          brew install mpv pkg-config

      - name: Build DMG
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:packageReleaseDmg \
            --no-daemon \
            --stacktrace

      - name: Find and rename DMG
        shell: bash
        run: |
          mkdir -p release

          DMG=$(find composeApp/build/compose/binaries \
            -type f -name "*.dmg" -print -quit)

          if [ -z "$DMG" ]; then
            echo "DMG not found"
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi

          cp "$DMG" "release/NuvioDesktop-${VERSION}-arm64.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioDesktop-macOS
          path: release/*.dmg

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/*.dmg \
            --title "NuvioDesktop $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

