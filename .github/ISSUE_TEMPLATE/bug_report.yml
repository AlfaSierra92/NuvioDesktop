name: Bug report
description: Report a reproducible bug (one per issue).
title: "[Bug]: short summary here"
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Report a bug in this Nuvio HTPC desktop fork.

        If we can reproduce it, we can usually fix it. This form is just to get the basics in one place.
        Please replace the default title with a short summary of the actual problem.

        If the app crashes, include relevant logs and a timestamp. Distinguish the
        player returning to browsing from the whole process terminating. Remove
        credentials and tokens before sharing URLs, logs or screenshots.

  - type: markdown
    attributes:
      value: |
        ## Quick checks

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I can reproduce this on the latest release or latest main build.
          required: false
        - label: This issue is limited to a single bug (not multiple unrelated problems).
          required: true
        - label: I described whether this affects all sources or only particular protocols, addons or local servers.
          required: true

  - type: markdown
    attributes:
      value: |
        ## Version & device

  - type: input
    id: app_version
    attributes:
      label: App version / commit
      description: Release version (e.g. 1.2.3) or commit hash. If unsure, say where you got the build from.
      placeholder: "e.g. 1.2.3, or main@abc1234"
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Install method
      options:
        - GitHub Release (DMG / MSI / ZIP)
        - CI build / Nightly
        - Built from source
        - Other (please describe below)
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (desktop)
        - Windows (desktop)
        - Linux (desktop)
        - Other (please describe below)
    validations:
      required: true

  - type: input
    id: device_model
    attributes:
      label: Device model
      description: "Include CPU architecture and GPU where relevant: MacBook Air M2 / ARM64, or Windows PC / x64 / GPU."
      placeholder: "e.g. MacBook Pro M2, ARM64"
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: OS version
      placeholder: "e.g. macOS 15.2 or Windows 11"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## What happened?

  - type: dropdown
    id: area
    attributes:
      label: Area (tag)
      description: Pick the closest match. It helps triage.
      options:
        - Playback (start/stop/buffering)
        - Streams / Sources (selection, loading, errors)
        - Next Episode / Auto-play
        - Watch Progress (resume, watched state, history)
        - Subtitles (download, styling, sync)
        - Audio tracks
        - Permissions / Local network / File access
        - Navigation / Gestures
        - UI / Layout
        - Settings
        - Sync (Trakt / remote)
        - Downloads / Offline
        - Platform-specific (macOS / Windows / Linux)
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps. If it depends on specific content, describe it (movie/series, season/episode, source/addon name) without sharing private links.
      placeholder: |
        1. Open ...
        2. Navigate to ...
        3. Click / select ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "What you expected to happen."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: "What actually happened (include any on-screen error text/codes)."
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Always
        - Often (more than 50%)
        - Sometimes
        - Rarely
        - Once
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: Did this work before?
      options:
        - Not sure
        - Yes, it used to work
        - No, it never worked
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Extra context (optional)

  - type: textarea
    id: media_details
    attributes:
      label: Media details (optional)
      description: Only include what you can safely share.
      placeholder: |
        - Content type: series/movie
        - Season/Episode: S1E2
        - Stream/source: (addon name / source label)
        - Video format: (if known)
    validations:
      required: false

  - type: textarea
    id: network_permissions
    attributes:
      label: Network / permission context (if relevant)
      description: Describe the affected resource without credentials or private stream tokens.
      placeholder: |
        - Direct URL or redirect; HTTP/HTTPS/other protocol
        - LAN IP, local hostname or public server; port
        - HTTP status or connection error
        - macOS permission allowed/denied/not requested; Finder or Terminal launch
        - File operation and selected folder/volume type, if relevant
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs (required for crash reports)
      description: |
        Required if the app crashes or force closes.
        For other bug reports, logs are optional but still helpful.

        **macOS:** `~/Library/Application Support/NuvioHTPC/logs/nuvio.log`
        and the matching report in `~/Library/Logs/DiagnosticReports`, if present.
        **Windows:** `%LOCALAPPDATA%\NuvioHTPC\logs\nuvio.log`
        **Portable:** `logs/nuvio.log` under the active portable data folder.
        For source builds, include relevant terminal output too. Redact tokens.
      render: shell
      placeholder: |
        Paste logs here
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else? (optional)
      description: Screenshots/recordings, related issues, workarounds, etc.
    validations:
      required: false
